name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: landing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d landing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pipeline:pipeline@localhost:5432/landing
      DBT_TARGET: ci
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dbt.txt
          pip install -r requirements-airflow.txt

      - name: Initialize database schema
        run: python -c "from src.pipeline.storage.postgres import init_schema; init_schema()"

      - name: Initialize Airflow metadata database
        run: airflow db migrate
        env:
          AIRFLOW_HOME: /tmp/airflow

      - name: Verify dbt project
        run: dbt ls --project-dir dbt --profiles-dir dbt --target ci

      - name: Run dbt smoke test
        run: |
          python -m src.pipeline.ingestion --source sample --storage postgres --pipeline-name ci-smoke
          dbt run --project-dir dbt --profiles-dir dbt --target ci
          dbt test --project-dir dbt --profiles-dir dbt --target ci

      - name: Run tests
        run: python -m pytest -q
        env:
          AIRFLOW_HOME: /tmp/airflow
