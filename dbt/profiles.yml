production_data_pipeline:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      user: "{{ env_var('DBT_USER', 'pipeline') }}"
      password: "{{ env_var('DBT_PASSWORD', 'pipeline') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      dbname: "{{ env_var('DBT_DBNAME', 'landing') }}"
      schema: silver
      threads: 2
    ci:
      type: postgres
      host: localhost
      user: pipeline
      password: pipeline
      port: 5432
      dbname: landing
      schema: silver
      threads: 2
